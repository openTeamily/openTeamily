<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/automations/app.css">
  <script type="module" src="/shell/app.mjs"></script>
  <script type="module" src="/shell/dsbot-api.mjs"></script>
  <script type="module" src="/automations/app.mjs"></script>
</head>
<body class="app-workspace">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <nav class="app-rail" aria-label="应用导航">
    <a class="brand-mark" href="/" title="OpenTeamily 首页" aria-label="OpenTeamily"><svg class="brand-glyph" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M20.8 8.4a8.3 8.3 0 1 0 .4 13.2"/><circle cx="16" cy="16" r="1.7" fill="currentColor"/><circle cx="22.4" cy="16.2" r="3.05" fill="currentColor"/></svg></a>
    <a href="/" title="首页" aria-label="首页"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg><span class="rail-label">首页</span></a>
    <a href="/chat" title="聊天" aria-label="聊天"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4V4Z"/></svg><span class="rail-label">聊天</span></a>
    <a href="/agents" title="智能体" aria-label="智能体"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14v12H5z M9 3h6 M12 3v4 M8 12h1 M15 12h1 M9 16h6"/></svg><span class="rail-label">智能体</span></a>
        <a href="/skills" title="技能" aria-label="技能"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v10l8 4 8-4V7l-8-4Z M8.5 10.5h7 M8.5 14h4.5"/></svg><span class="rail-label">技能</span></a>
<a href="/automations" title="自动化" aria-label="自动化"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h3v3H4z M11 6h9 M4 11h3v3H4z M11 12h9 M4 17h3v3H4z M11 18h9"/></svg><span class="rail-label">自动化</span></a>
    <a href="/memory" title="记忆" aria-label="记忆"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4a4 4 0 0 0-4 4v8a4 4 0 0 0 4 4 M16 4a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4 M8 8h8 M8 12h8 M8 16h8 M12 4v16"/></svg><span class="rail-label">记忆</span></a>
    <a href="/space" title="作品" aria-label="作品"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z M3 12l9 5 9-5 M3 16l9 5 9-5"/></svg><span class="rail-label">作品</span></a>
    <a href="/meetings" title="会议" aria-label="会议"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v14H4z M8 3v4 M16 3v4 M4 10h16"/></svg><span class="rail-label">会议</span></a>
    <a href="/discover" title="发现" aria-label="发现"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z m4 5-2 6-6 2 2-6 6-2Z"/></svg><span class="rail-label">发现</span></a>
    <span class="rail-spacer"></span>
    <a href="/profile" class="rail-signed-in" hidden title="我的资料" aria-label="我"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0 4 4 0 0 0-8 0 M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span class="rail-label">我</span></a>
    <button type="button" id="appearance-toggle" class="rail-link rail-signed-in" hidden title="切换外观">浅色</button>
    <a href="/download" title="下载" aria-label="下载"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12 m-5-5 5 5 5-5 M4 16v5h16v-5"/></svg><span class="rail-label">下载</span></a>
    <div class="account-slot" hidden>
      <button type="button" id="account-menu-button" class="account-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" title="账户菜单">账户</button>
      <div id="account-menu" class="account-menu" role="menu" hidden>
        <p id="account-identity" class="account-identity"></p>
        <a href="/profile" role="menuitem" aria-label="查看我的资料">查看我的资料</a>
        <a href="/team" role="menuitem">创建团队</a>
        <div class="account-sub">
          <button type="button" id="help-menu-button" aria-expanded="false" aria-controls="help-menu">帮助</button>
          <div id="help-menu" hidden>
            <a href="/help" role="menuitem">帮助中心</a>
            <a href="/guide" role="menuitem">功能指引</a>
            <a href="/download" role="menuitem" aria-label="下载">下载</a>
            <a href="/settings#send-shortcut" role="menuitem">快捷键</a>
            <a href="/terms" role="menuitem">服务条款</a>
            <a href="/privacy" role="menuitem">隐私政策</a>
            <a href="https://github.com/openTeamily/openTeamily/issues" rel="noreferrer" target="_blank" role="menuitem" title="指向本仓库的 issue 列表，不是 Teamily 的联系邮箱">报告问题</a>
          </div>
        </div>
        <a href="/settings" role="menuitem" aria-label="所有设置">所有设置</a>
        <form id="logout-form" method="post" action="/v1/auth/logout">
          <button type="submit">退出登录</button>
        </form>
      </div>
    </div>
  </nav>
  <p id="status" role="status"></p>
  <main id="main">
  <section id="login-panel" hidden>
    <h2>登录</h2>
    <form id="login-form" method="post" action="/v1/auth/login">
      <label>用户名 <input type="text" id="username" name="username" required autocomplete="username" maxlength="64"></label>
      <label>密码 <input id="password" name="password" type="password" required autocomplete="current-password" minlength="12" maxlength="256"></label>
      <button type="submit">登录</button>
    </form>
    <div id="oidc-providers"></div>
  </section>
  <section id="main-panel" hidden>
    <header class="page-top">
      <div class="page-heading">
        <h1>自动化</h1>
        <button type="button" id="new-automation" disabled>新建自动化</button>
      </div>

    </header>
    <p id="whoami" class="visually-hidden"></p>
    <div class="page-toolbar">
      <label class="workspace-field">工作区
        <select id="workspace" aria-describedby="workspace-status"></select>
      </label>
      <span id="workspace-status" role="status"></span>
    </div>
    <section id="list-panel">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-category="mine" aria-selected="true">我的自动化</button>
        <button type="button" role="tab" data-category="work" aria-selected="false">工作</button>
        <button type="button" role="tab" data-category="life" aria-selected="false">生活</button>
      </div>
      <label class="pill-search"><span class="visually-hidden">搜索</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" maxlength="80" autocomplete="off" placeholder="搜索">
      </label>
      <ul id="automation-list"></ul>
      <p id="list-empty" class="empty-state" hidden>这个分类下还没有自动化。</p>
    </section>
    <form id="editor-form" method="post" action="/v1/workspaces" hidden>
      <header class="editor-head">
        <button type="button" id="cancel-editor">‹ 自动化</button>
        <h1 id="editor-heading">新建自动化</h1>
      </header>
      <fieldset class="task-details">
        <legend>任务</legend>
        <label>名称 <input type="text" name="title" maxlength="80" required autocomplete="off" placeholder="例如：每周整理会议纪要"></label>
        <label>交给智能体的任务 <textarea name="prompt" maxlength="4000" placeholder="描述要完成的任务和期望的结果"></textarea></label>
      </fieldset>
      <fieldset>
        <legend>运行时间</legend>
        <label>频率
          <select name="kind" id="schedule-kind">
            <option value="now">启用后运行一次</option>
            <option value="later">指定日期</option>
            <option value="daily">每天</option>
            <option value="weekdays">工作日</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
          </select>
        </label>
        <div class="schedule-fields">
          <label data-schedule-kind="later" hidden>日期 <input type="date" name="date"></label>
          <label data-schedule-kind="weekly" hidden>星期
            <select name="weekday">
              <option value="1">星期一</option>
              <option value="2">星期二</option>
              <option value="3">星期三</option>
              <option value="4">星期四</option>
              <option value="5">星期五</option>
              <option value="6">星期六</option>
              <option value="7">星期日</option>
            </select>
          </label>
          <label data-schedule-kind="monthly" hidden>每月第几天 <input type="number" name="day" min="1" max="31" value="1"></label>
          <label data-schedule-kind="timed" hidden>时间 <input type="time" name="time" value="09:00"></label>
          <label data-schedule-kind="timed" hidden>时区 <input type="text" name="time_zone" value="Asia/Shanghai" maxlength="64" autocomplete="off"></label>
        </div>
        <label class="schedule-toggle"><input type="checkbox" name="enabled"> 启用自动运行</label>
      </fieldset>
      <details class="editor-options">
        <summary>更多设置</summary>
        <div class="editor-option-fields">
          <label>模板 <select name="template_id"><option value="custom">自定义</option></select></label>
          <label>意图
            <select name="intent">
              <option value="">（不指定）</option>
              <option value="research">研究</option>
              <option value="monitor">监测</option>
              <option value="create">创作</option>
              <option value="analyze">分析</option>
              <option value="plan">规划</option>
              <option value="collaborate">协同</option>
            </select>
          </label>
          <label>范围
            <select name="scope">
              <option value="once">单次</option>
              <option value="ongoing">长期</option>
            </select>
          </label>
          <label>参与成员 <input type="text" name="participants" maxlength="512" autocomplete="off" placeholder="用户名，以逗号分隔"></label>
          <label>参与的智能体 <input type="text" name="agents" maxlength="512" autocomplete="off" placeholder="名称，以逗号分隔"></label>
        </div>
      </details>
      <div class="editor-actions">
        <button type="submit" id="save-automation">保存</button>
        <button type="button" id="tick-automation" hidden>运行一次</button>
        <button type="button" id="remove-automation" hidden>删除</button>
      </div>
    </form>
    <section id="run-panel" hidden>
      <h2>运行记录</h2>
      <nav class="run-filters" aria-label="运行状态">
        <button type="button" id="run-filter-all" data-run-filter="all" aria-current="true">全部</button>
        <button type="button" id="run-filter-succeeded" data-run-filter="succeeded" aria-current="false">成功</button>
        <button type="button" id="run-filter-failed" data-run-filter="failed" aria-current="false">失败</button>
      </nav>
      <ul id="run-list"></ul>
      <p id="run-empty" class="empty-state" hidden>还没有运行记录。</p>
      <p id="run-filter-empty" class="empty-state" hidden>没有符合这个筛选的运行记录。</p>
    </section>
  </section>
  </main>
</body>
</html>
