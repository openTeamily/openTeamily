name: UI screenshots
on:
  # Feature-branch pushes are validated by the pull_request run; keep the push
  # trigger for main only so the same branch is not executed twice (fork + PR).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Start a throwaway loopback management app
        run: |
          set -eu
          python scripts/ci_ui_screenshots.py \
            --data-dir "$RUNNER_TEMP/ot-ui-data" \
            --out "$RUNNER_TEMP/ot-ui-meta" \
            --serve > "$RUNNER_TEMP/ot-ui-serve.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ot-ui-serve.pid"
      - name: Install Playwright on the runner only
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          mkdir -p ot-playwright
          cd ot-playwright
          npm init -y >/dev/null
          npm install playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Wait until the fixture app is ready
        run: |
          set -eu
          pid="$(cat "$RUNNER_TEMP/ot-ui-serve.pid")"
          for _ in $(seq 1 90); do
            if [ -f "$RUNNER_TEMP/ot-ui-meta/ready.json" ]; then
              python -c 'import json,pathlib,sys; data=json.loads(pathlib.Path(sys.argv[1]).read_text()); print("origin=%s run=%s connection=%s chat=%s" % (data["origin"], data["run_status"], data["connection_status"], data.get("chat_status")))' "$RUNNER_TEMP/ot-ui-meta/ready.json"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "fixture process exited before ready.json was written" >&2
              if [ -f "$RUNNER_TEMP/ot-ui-serve.log" ]; then cat "$RUNNER_TEMP/ot-ui-serve.log" >&2; fi
              exit 1
            fi
            sleep 1
          done
          echo "timed out waiting for ready.json" >&2
          if [ -f "$RUNNER_TEMP/ot-ui-serve.log" ]; then cat "$RUNNER_TEMP/ot-ui-serve.log" >&2; fi
          exit 1
      - name: Capture real management pages
        run: |
          set -eu
          # ESM walks from the script path, not NODE_PATH, so expose the runner install here.
          ln -sfn "$RUNNER_TEMP/ot-playwright/node_modules" "$GITHUB_WORKSPACE/node_modules"
          mkdir -p "$GITHUB_WORKSPACE/ui-screenshots"
          node scripts/ci_ui_screenshots.mjs --meta "$RUNNER_TEMP/ot-ui-meta" --out "$GITHUB_WORKSPACE/ui-screenshots"
      - name: Stop the throwaway app
        if: always()
        run: |
          set -eu
          if [ -f "$RUNNER_TEMP/ot-ui-serve.pid" ]; then
            pid="$(cat "$RUNNER_TEMP/ot-ui-serve.pid")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openteamily-ui-screenshots
          path: ui-screenshots
          if-no-files-found: error
          retention-days: 30
