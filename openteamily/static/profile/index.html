<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>我的资料 · OpenTeamily</title>
  <link rel="stylesheet" href="/shell/app.css">
  <link rel="stylesheet" href="/profile/app.css">
  <script type="module" src="/shell/app.mjs"></script>
  <script type="module" src="/profile/app.mjs"></script>
</head>
<body class="app-workspace">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <nav class="app-rail" aria-label="应用导航">
    <a class="brand-mark" href="/chat" title="OpenTeamily" aria-label="OpenTeamily"><svg class="brand-glyph" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M20.8 8.4a8.3 8.3 0 1 0 .4 13.2"/><circle cx="16" cy="16" r="1.7" fill="currentColor"/><circle cx="22.4" cy="16.2" r="3.05" fill="currentColor"/></svg></a>
    <a href="/chat" title="聊天" aria-label="聊天"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4V4Z"/></svg><span class="rail-label">聊天</span></a>
    <a href="/agents" title="智能体" aria-label="智能体"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14v12H5z M9 3h6 M12 3v4 M8 12h1 M15 12h1 M9 16h6"/></svg><span class="rail-label">智能体</span></a>
        <a href="/skills" title="技能" aria-label="技能"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v10l8 4 8-4V7l-8-4Z M8.5 10.5h7 M8.5 14h4.5"/></svg><span class="rail-label">技能</span></a>
<a href="/automations" title="自动化" aria-label="自动化"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h3v3H4z M11 6h9 M4 11h3v3H4z M11 12h9 M4 17h3v3H4z M11 18h9"/></svg><span class="rail-label">自动化</span></a>
    <a href="/memory" title="记忆" aria-label="记忆"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4a4 4 0 0 0-4 4v8a4 4 0 0 0 4 4 M16 4a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4 M8 8h8 M8 12h8 M8 16h8 M12 4v16"/></svg><span class="rail-label">记忆</span></a>
    <a href="/space" title="作品" aria-label="作品"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z M3 12l9 5 9-5 M3 16l9 5 9-5"/></svg><span class="rail-label">作品</span></a>
    <a href="/meetings" title="会议" aria-label="会议"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v14H4z M8 3v4 M16 3v4 M4 10h16"/></svg><span class="rail-label">会议</span></a>
    <a href="/discover" title="发现" aria-label="发现"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z m4 5-2 6-6 2 2-6 6-2Z"/></svg><span class="rail-label">发现</span></a>
    <span class="rail-spacer"></span>
    <a href="/profile" class="rail-signed-in" hidden title="我的资料" aria-label="我"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0 4 4 0 0 0-8 0 M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span class="rail-label">我</span></a>
    <button type="button" id="appearance-toggle" class="rail-link rail-signed-in" hidden title="切换浅色或深色。会写入已有外观设置；按钮在深色下显示「深色」。点击后的标签变化未经 Teamily 核实。">浅色</button>
    <a href="/download" title="下载" aria-label="下载"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12 m-5-5 5 5 5-5 M4 16v5h16v-5"/></svg><span class="rail-label">下载</span></a>
    <div class="account-slot" hidden>
      <button type="button" id="account-menu-button" class="account-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" title="账户菜单">账户</button>
      <div id="account-menu" class="account-menu" role="menu" hidden>
        <p id="account-identity" class="account-identity"></p>
        <a href="/profile" role="menuitem" aria-label="查看我的资料">查看我的资料</a>
        <a href="/team" role="menuitem">创建团队</a>
        <div class="account-sub">
          <button type="button" id="help-menu-button" aria-expanded="false" aria-controls="help-menu">帮助</button>
          <div id="help-menu" hidden>
            <button type="button" disabled title="未实现：还没有 OpenTeamily 帮助中心页">帮助中心</button>
            <a href="/guide" role="menuitem">功能指引</a>
            <a href="/download" role="menuitem" aria-label="下载">下载</a>
            <a href="/settings#send-shortcut" role="menuitem">快捷键</a>
            <button type="button" disabled title="未实现：还没有 OpenTeamily 服务条款页">服务条款</button>
            <button type="button" disabled title="未实现：还没有 OpenTeamily 隐私政策页">隐私政策</button>
            <a href="https://github.com/openTeamily/openTeamily/issues" rel="noreferrer" target="_blank" role="menuitem" title="指向本仓库的 issue 列表，不是 Teamily 的联系邮箱">报告问题</a>
          </div>
        </div>
        <a href="/settings" role="menuitem" aria-label="所有设置">所有设置</a>
        <form id="logout-form" method="post" action="/v1/auth/logout">
          <button type="submit">退出登录</button>
        </form>
      </div>
    </div>
  </nav>
  <p id="status" role="status"></p>
  <main id="main">
  <section id="login-panel" hidden>
    <h2>登录</h2>
    <form id="login-form" method="post" action="/v1/auth/login">
      <label>用户名 <input id="username" name="username" required autocomplete="username" maxlength="64"></label>
      <label>密码 <input id="password" name="password" type="password" required autocomplete="current-password" minlength="12" maxlength="256"></label>
      <button type="submit">登录</button>
    </form>
  </section>
  <section id="main-panel" hidden>
    <p id="whoami" hidden></p>
    <div id="profile-home" class="profile-home">
      <div class="profile-home-main">
        <header class="profile-hero">
          <div class="profile-hero-row">
            <div class="profile-hero-id">
              <span id="profile-avatar" class="profile-avatar avatar" data-tone="1" aria-hidden="true"></span>
              <div class="profile-hero-copy">
                <h1 class="profile-display-name"><span id="profile-username"></span></h1>
                <ul class="profile-stats">
                  <li><button type="button" id="stat-following" class="profile-stat" data-dialog-tab="following"><strong id="stat-following-count">0</strong> 关注</button></li>
                  <li><button type="button" id="stat-followers" class="profile-stat" data-dialog-tab="followers"><strong id="stat-followers-count">0</strong> 粉丝</button></li>
                  <li><span class="profile-stat is-static"><strong id="stat-likes-count">0</strong> 赞与收藏</span></li>
                </ul>
              </div>
            </div>
            <div class="profile-hero-actions">
              <a href="/profile/edit" id="profile-edit-open" class="profile-icon-btn" title="编辑资料" aria-label="编辑资料">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10.5-10.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 16v4Z M13 6l5 5"/></svg>
              </a>
              <button type="button" class="profile-icon-btn" disabled title="未接通：还没有礼物或打赏接口" aria-label="礼物（未接通）">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v9H4z M4 11V8h16v3 M12 8v12 M8 8c0-2 1.5-3 3-3 2 0 2 2 1 3 M16 8c0-2-1.5-3-3-3-2 0-2 2-1 3"/></svg>
              </button>
              <button type="button" class="profile-icon-btn" disabled title="未接通：还没有通知订阅接口" aria-label="通知（未接通）">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17h12l-1.2-2V10a4.8 4.8 0 0 0-9.6 0v5L6 17Z M10 17a2 2 0 0 0 4 0"/></svg>
              </button>
              <button type="button" class="profile-icon-btn" disabled title="未接通：还没有分享个人主页接口" aria-label="分享（未接通）">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7 M8 8l4-4 4 4 M12 4v12"/></svg>
              </button>
            </div>
          </div>
          <div class="profile-tabs" role="tablist" aria-label="个人主页">
            <button type="button" role="tab" id="tab-posts" aria-selected="true" aria-controls="profile-feed">帖子</button>
            <button type="button" role="tab" id="tab-saved" aria-selected="false" aria-controls="profile-feed">收藏</button>
            <button type="button" role="tab" id="tab-liked" aria-selected="false" aria-controls="profile-feed">点赞</button>
          </div>
        </header>
        <div id="profile-feed" class="profile-feed" role="tabpanel">
          <p id="profile-feed-empty" class="profile-feed-empty">还没有帖子，发布你的第一篇吧。</p>
        </div>
      </div>
      <aside class="profile-agents" aria-labelledby="profile-agents-title">
        <h2 id="profile-agents-title">智能体</h2>
        <ul id="profile-agent-list"></ul>
        <p id="profile-agents-empty" class="note" hidden>这个账号还没有智能体。</p>
        <a id="profile-agents-all" class="profile-agents-all" href="/agents">显示全部 ›</a>
      </aside>
    </div>
    <div id="profile-edit" class="profile-edit" hidden>
    <header class="profile-edit-head">
      <a href="/profile" class="settings-back profile-edit-back" id="profile-edit-back">‹ 编辑资料</a>
    </header>
    <form id="profile-form" class="profile-form">
      <div class="profile-edit-avatar">
        <span id="profile-edit-avatar" class="profile-avatar avatar" data-tone="1" aria-hidden="true"></span>
        <button type="button" id="profile-change-avatar" class="profile-change-avatar" disabled title="未接通：还没有头像上传接口">更换头像</button>
      </div>
      <p class="profile-section-label">公开信息</p>
      <label class="profile-field">昵称
        <span class="profile-counter" id="count-name">0/40</span>
        <input id="profile-name" name="name" maxlength="40" required autocomplete="nickname">
      </label>
      <label class="profile-field">Teamily ID
        <span class="profile-field-hint" id="handle-hint"></span>
        <input id="profile-handle" name="handle" maxlength="30" placeholder="3–30 位小写字母、数字、点或下划线">
      </label>
      <label class="profile-field">个人简介
        <span class="profile-counter" id="count-bio">0/200</span>
        <textarea id="profile-bio" name="bio" maxlength="200" rows="3" placeholder="介绍一下你自己"></textarea>
      </label>
      <label class="profile-field">标签
        <span class="profile-counter" id="count-tags">0/8</span>
        <input id="profile-tags" name="tags" maxlength="200" placeholder="添加标签" aria-describedby="tags-hint">
        <span id="tags-hint" class="profile-field-hint">用逗号分隔，最多 8 个。按回车也可保存整份资料。</span>
      </label>
      <p class="profile-section-label">详细信息</p>
      <label class="profile-field">性别
        <select id="profile-gender" name="gender">
          <option value="">未设置</option>
          <option value="male">男</option>
          <option value="female">女</option>
          <option value="other">其他</option>
        </select>
      </label>
      <label class="profile-field">所在地
        <input id="profile-location" name="location" maxlength="80" placeholder="城市，国家">
      </label>
      <label class="profile-field">网站
        <input id="profile-website" name="website" maxlength="200" placeholder="https://...">
      </label>
      <p class="profile-section-label">人生目标</p>
      <p class="note profile-goals-note">仅你自己可见。可以留空。</p>
      <label class="profile-field">健康与身心 <textarea id="goal-health" maxlength="200" rows="2" placeholder="例如：每周跑两次"></textarea></label>
      <label class="profile-field">财务目标 <textarea id="goal-finance" maxlength="200" rows="2" placeholder="例如：存够 6 个月的生活费，每月定投"></textarea></label>
      <label class="profile-field">职业发展 <textarea id="goal-career" maxlength="200" rows="2" placeholder="例如：学习产品设计"></textarea></label>
      <label class="profile-field">兴趣爱好 <textarea id="goal-hobbies" maxlength="200" rows="2" placeholder="例如：今年读 20 本书"></textarea></label>
      <label class="profile-field">家庭与关系 <textarea id="goal-family" maxlength="200" rows="2" placeholder="例如：多给父母打电话"></textarea></label>
      <label class="profile-field">效率 <textarea id="goal-productivity" maxlength="200" rows="2" placeholder="例如：每天清空收件箱"></textarea></label>
      <label class="profile-field">其他 <textarea id="goal-other" maxlength="200" rows="2" placeholder="其他希望被帮助的事"></textarea></label>
      <p id="profile-meta" class="note"></p>
      <div class="profile-actions">
        <button type="button" id="profile-cancel" class="secondary">取消</button>
        <button type="submit" id="profile-save">保存</button>
        <button type="button" id="profile-reload" class="secondary">重新加载</button>
        <a id="profile-public" href="/v1/profile" target="_blank" rel="noreferrer">查看公开主页</a>
      </div>
      <section class="profile-private" aria-label="私密信息">
        <p class="profile-section-label">私密信息</p>
        <p class="note">不会在你的主页上展示。</p>
        <div class="profile-private-row">
          <div>
            <p class="profile-private-label">邮箱</p>
            <p id="profile-email">未设置</p>
          </div>
          <a href="/settings" class="profile-private-link">在设置中管理</a>
        </div>
        <p class="profile-delete-wrap">
          <button type="button" id="profile-delete-account" class="profile-delete" disabled title="未接通：还没有删除账户接口">删除账户 ›</button>
        </p>
      </section>
    </form>
    </div>
    <div id="followers-dialog" class="profile-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="followers-dialog-title">
      <div class="profile-dialog-card">
        <header class="profile-dialog-head">
          <h2 id="followers-dialog-title"></h2>
          <button type="button" id="followers-dialog-close" aria-label="关闭">×</button>
        </header>
        <div class="profile-dialog-tabs" role="tablist">
          <button type="button" role="tab" id="dialog-tab-following" aria-selected="false">0 关注</button>
          <button type="button" role="tab" id="dialog-tab-followers" aria-selected="true">0 粉丝</button>
        </div>
        <label class="profile-dialog-search">
          <span class="visually-hidden">搜索</span>
          <input id="followers-search" type="search" placeholder="搜索粉丝" autocomplete="off" maxlength="80">
        </label>
        <p id="followers-dialog-empty" class="profile-dialog-empty">还没有粉丝。关注和粉丝功能尚未接通。</p>
        <ul id="followers-dialog-list" hidden></ul>
      </div>
    </div>
  </section>
  </main>
</body>
</html>
